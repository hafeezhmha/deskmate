<!doctype html>
<!-- Draws the dock icon (Zaif, close up) so it always matches the sprite.
     Regenerate with: npm run icon -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <style>
      html, body { margin: 0; background: transparent; }
      canvas { width: 192px; height: 192px; image-rendering: pixelated; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c" width="24" height="24"></canvas>
    <script type="module" src="icon.js"></script>
  </body>
</html>
