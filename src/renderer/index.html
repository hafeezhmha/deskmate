<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'"
    />
    <title>Zaif</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="room" width="208" height="112"></canvas>
        <div id="grip" title="drag to move"></div>
        <button id="toggle-panel" class="icon" title="show / hide panel">≡</button>
        <div id="bubble" hidden></div>
      </div>

      <aside id="panel">
        <header class="drag">
          <span class="title">Zaif</span>
          <span class="coins"><i class="coin"></i><span id="coins">0</span></span>
          <button data-sheet="mail" class="icon mail-btn" title="mail">
            <svg viewBox="0 0 12 9" width="14" height="11" shape-rendering="crispEdges" aria-hidden="true">
              <rect width="12" height="9" fill="#2b2233" />
              <rect x="1" y="1" width="10" height="7" fill="#fffaf0" />
              <path fill="#2b2233" d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h2v1H5zM7 4h1v1H7zM8 3h1v1H8zM9 2h1v1H9zM10 1h1v1h-1z" />
            </svg>
            <span id="mail-badge" class="badge" hidden></span>
          </button>
          <button data-sheet="settings" class="icon" title="settings">⚙</button>
          <button id="btn-min" class="icon" title="minimize">–</button>
          <button id="btn-close" class="icon" title="quit">×</button>
        </header>

        <section class="card">
          <div class="label">current project</div>
          <div id="project-name" class="name"></div>
          <div class="bar"><div id="project-bar"></div></div>
          <div id="project-meta" class="small"></div>
          <div class="row" style="margin-top: 7px">
            <span class="label">energy</span>
            <span id="status" class="small"></span>
          </div>
          <div class="bar energy"><div id="energy-bar"></div></div>
        </section>

        <section class="card clickable" data-sheet="today" title="today and this week">
          <div class="row">
            <span class="label">today</span>
            <span id="today-total" class="small"></span>
          </div>
          <div class="split" id="today-bar"></div>
          <div id="today-legend" class="legend"></div>
          <div class="goals-row" data-sheet="goals" title="this week's goals">
            <span class="label">week goals</span>
            <span id="goal-pips" class="pips"></span>
            <span id="goal-count" class="small"></span>
          </div>
          <div id="footer-note" class="legend warn"></div>
        </section>

        <nav class="buttons">
          <button data-sheet="projects">Projects</button>
          <button data-sheet="upgrades">Upgrades</button>
          <button data-sheet="shop">Shop</button>
          <button data-sheet="break" id="btn-break">Break</button>
        </nav>

        <div id="sheet" hidden>
          <header>
            <span id="sheet-title"></span>
            <button id="sheet-close" class="icon" title="close">×</button>
          </header>
          <div id="sheet-body"></div>
        </div>
      </aside>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
